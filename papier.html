  <button id="theme-toggle">Modus wechseln</button>

  <script>
    const button = document.getElementById('theme-toggle');
    const modes = ['dark', 'light', 'spooky'];
    let currentModeIndex = 0;

    if (document.documentElement.classList.contains('light')) {
        currentModeIndex = 1;
    }

    button.addEventListener('click', () => {
        currentModeIndex = (currentModeIndex + 1) % modes.length;
        const currentMode = modes[currentModeIndex];

        document.documentElement.classList.remove('light');
        document.body.classList.remove('spooky');

        if (currentMode === 'light') {
            document.documentElement.classList.add('light');
            button.textContent = "Modus: Hell";
        } else if (currentMode === 'spooky') {
            document.body.classList.add('spooky');
            button.textContent = "Modus: Spooky";
        } else {
            button.textContent = "Modus: Dunkel";
        }
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const avatarLink = document.getElementById('avatar-link');
    
      if (avatarLink) {
        const urlParams = new URLSearchParams(window.location.search);
        const hatWeiterleitungParam = urlParams.get('weiterleitung') === 'ja';
        const kamDirektVonIndexVoll = document.referrer.includes('index_voll.html');

        if (hatWeiterleitungParam || kamDirektVonIndexVoll) {
            sessionStorage.setItem('kommtVonIndexVoll', 'true');
        }

        if (sessionStorage.getItem('kommtVonIndexVoll') === 'true') {
            avatarLink.href = "index_voll.html#papier";
        }
      }
    });

    const avatarSketch = (p) => {
      let img;
      let blinkTimer = 0;
      let pauseTimer = 0;       
      let isBlinking = false;
      let doubleBlinkQueue = false; 
      let nextBlinkFrame = 200;     

      p.preload = () => {
        img = p.loadImage('me.jpg'); 
      };

      p.setup = () => {
        let canvas = p.createCanvas(350, 350);
        canvas.parent('avatar-animation-holder');
      };

      p.draw = () => {
        p.clear();
        p.image(img, 0, 0, p.width, p.height);

        if (p.frameCount >= nextBlinkFrame && !isBlinking && pauseTimer <= 0) {
          isBlinking = true;
          blinkTimer = 10; 
          doubleBlinkQueue = p.random(1) < 0.1; 
          nextBlinkFrame = p.frameCount + p.floor(p.random(200, 250));
        }

        if (isBlinking) {
          blinkEyes();
          blinkTimer--;
          
          if (blinkTimer <= 0) {
            isBlinking = false;
            if (doubleBlinkQueue) {
              doubleBlinkQueue = false; 
              pauseTimer = 6; 
            }
          }
        }
    
        if (pauseTimer > 0) {
          pauseTimer--;
          if (pauseTimer === 0) {
            isBlinking = true;
            blinkTimer = 10;
          }
        }
       
        // Brücke/Brille
        p.stroke(0);          
        p.strokeWeight(6);    
        p.fill(183, 189, 189);          
        p.ellipse(175, 185, 170, 120);
      };

      function blinkEyes() {
        p.push(); 
        p.stroke(0);          
        p.strokeWeight(6);    
        p.fill(183, 189, 189);          

        p.ellipse(135, 115, 70, 70); 
        p.ellipse(205, 115, 75, 75); 

        p.strokeWeight(5);
        p.line(130, 115, 174, 115); 
        p.line(176, 115, 220, 115); 
        p.pop(); 
      }
    };

    new p5(avatarSketch);

    // ----------------------------------------------------------------------
    // Universelle Dialog Logik (optimiert für Event-Abfangung)
    // ----------------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", () => {

        const videoDialog = document.getElementById('videoDialog');
        const openVideoBtn = document.getElementById('openVideoBtn');
        const popupVideo = document.getElementById('popupVideo');

        if (openVideoBtn && videoDialog && popupVideo) {
            openVideoBtn.addEventListener('click', (e) => {
                e.preventDefault();
                videoDialog.showModal();
                popupVideo.play();
            });
        }

        const infoDialog = document.getElementById('infoDialog');
        const openInfoBtn = document.getElementById('openInfoBtn');

        if (openInfoBtn && infoDialog) {
            openInfoBtn.addEventListener('click', (e) => {
                e.preventDefault();
                infoDialog.showModal();
            });
        }

        const codeDialog = document.getElementById('codeDialog');
        const openCodeBtn = document.getElementById('openCodeBtn');
        const iframe = document.getElementById('strahlenblumeFrame');

        if (openCodeBtn && codeDialog && iframe) {
            openCodeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                codeDialog.showModal();
                iframe.src = "https://khz-66.github.io/processing.js/";
            });
        }

        const orbiterDialog = document.getElementById('orbiterDialog');
        const openOrbiterBtn = document.getElementById('openOrbiterBtn');
        const orbiterFrame = document.getElementById('orbiterFrame');

        if (openOrbiterBtn && orbiterDialog && orbiterFrame) {
            openOrbiterBtn.addEventListener('click', (e) => {
                e.preventDefault();
                orbiterDialog.showModal();
                orbiterFrame.src = "https://khz-66.github.io/Orbiter-Live-Hintergrund/";
            });
        }

        const puzzleDialog = document.getElementById('puzzleDialog');
        const openPuzzleBtn = document.getElementById('openPuzzleBtn');
        const puzzleFrame = document.getElementById('puzzleFrame');

        if (openPuzzleBtn && puzzleDialog && puzzleFrame) {
            openPuzzleBtn.addEventListener('click', (e) => {
                e.preventDefault();
                puzzleDialog.showModal();
                puzzleFrame.src = "puzzle.html";
            });
        }

        // Event-Listener für das native Schließen (z. B. via ESC-Taste)
        document.querySelectorAll('dialog.dialog-base').forEach(dialog => {
            dialog.addEventListener('close', () => {
                const video = dialog.querySelector('video');
                if (video) {
                    video.pause();
                }
                // Optionale Bereinigung von Iframes beim Schließen:
                const frame = dialog.querySelector('iframe');
                if (frame) {
                    frame.src = ""; 
                }
            });
            
            // Klick auf abgedunkelten Hintergrund
            dialog.addEventListener('click', (e) => {
                if (e.target === dialog) {
                    dialog.close();
                }
            });
        });

        // Schließen über alle "X"-Buttons
        document.querySelectorAll('.closeDialogBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                const dialog = btn.closest('dialog');
                if (dialog) dialog.close();
            });
        });
    });
    
    function syncPuzzleTheme() {
    const iframe = document.querySelector("#puzzleDialog iframe");
    if (!iframe) return;

    iframe.addEventListener("load", () => {
        const mainRoot = document.documentElement;
        const mainBody = document.body;

        const iframeDoc = iframe.contentDocument;
        const iframeRoot = iframeDoc.documentElement;
        const iframeBody = iframeDoc.body;

        // 1. CSS-Variablen kopieren
        const styles = getComputedStyle(mainRoot);
        for (let i = 0; i < styles.length; i++) {
            const prop = styles[i];
            if (prop.startsWith("--")) {
                iframeRoot.style.setProperty(prop, styles.getPropertyValue(prop));
            }
        }

        // 2. Theme-Klasse vom BODY spiegeln (WICHTIG!)
        iframeBody.className = mainBody.className;
    });
}

syncPuzzleTheme();
document.addEventListener("themeChanged", syncPuzzleTheme);

    
  </script>
