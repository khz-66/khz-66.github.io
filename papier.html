<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papiermodelle</title>
    
    <style>
        /* ==========================================================================
           1. RESET & BASICS
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            background-color: whitesmoke; 
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; /* Hinweis: Weißer Text auf whitesmoke ist unsichtbar! Eventuell zu #333333 ändern */
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden; 
        }

        /* ==========================================================================
           2. INHALTS-LAYOUT (HAUPTCONTAINER)
           ========================================================================== */
        .container {
            position: relative;
            z-index: 1; 
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1; 
        }

        h2 {
            font-size: 2rem;
            margin: 40px 0 20px 0;
            color: #ffae00;
        }
        
        p {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 20px;
            text-align: left; 
        }
        
        .text-center {
            text-align: center;
        }

        .content-image {
            display: block;        /* Verhält sich wie ein Block, Text muss weichen */
            max-width: 500px;      /* Begrenzt die Breite auf maximal 500 Pixel */
            width: 100%;           /* Skaliert sauber runter, falls der Bildschirm kleiner als 500px ist */
            height: auto;
            border-radius: 8px;
            margin: 20px auto;     /* 20px Abstand nach oben/unten, "auto" zentriert das Bild */
        }

img.frame {
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 4px;
  box-shadow: 0 0 6px rgba(255,255,255,0.15);
}
        
     .image-row {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;        /* Erlaubt das automatische Untereinanderbrechen */
    margin-bottom: 40px;
}

.image-row a {
    display: block;
    flex: 1 1 280px;        /* 280px ist die Mindestbreite pro Bild. Wird es enger, bricht es um */
    max-width: 100%;        /* Verhindert das Herausragen auf ganz kleinen Displays */
}

.image-row img {
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 6px;
}

/* Container für Bild + Text */
.image-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0; /* Reset für Standard-Browser-Abstände */
    width: 100%;
    /* Falls nebeneinander mit Mindestbreite (Variante 2 aus der vorherigen Antwort): */
     flex: 1 1 280px; 
     max-width: 100%; 
}

/* Die Links in den Items */
.image-item a {
    display: block;
    width: 100%;
    max-width: 500px; /* Begrenzung, damit die Bilder untereinander nicht zu riesig werden */
}

/* Die Bilder selbst */
.image-item img {
    width: 100%;
    height: auto;
    object-fit: cover;
    border-radius: 6px;
}

/* Die Bildunterschrift / Überschrift */
.image-item figcaption {
    font-size: 0.95rem;       /* Etwas kleinere Schrift (Standard im Container ist 1.2rem) */
    color: #a0a0a0;           /* Ein dezentes Grau, passend zum Fließtext */
    margin-top: 8px;          /* Kleiner Abstand zum Bild darüber */
    text-align: center;       /* Zentriert den Text unter dem Bild */
    width: 100%;
    max-width: 500px;         /* Bündig mit der maximalen Bildbreite */
}


.image-scroll {
  display: flex;
  flex-wrap: nowrap;       /* verhindert Umbruch */
  overflow-x: auto;        /* aktiviert horizontales Scrollen */
  gap: 12px;               /* Abstand zwischen Bildern */
  padding: 20px 0;         /* Abstand oben und unten */
  scrollbar-width: thin;   /* Firefox */
  margin-bottom: 40px;
}

.image-scroll::-webkit-scrollbar {
  height: 8px;             /* Höhe der Scrollbar */
}

.image-scroll::-webkit-scrollbar-thumb {
  background: #555;
  border-radius: 4px;
}

.image-scroll img {
  height: 300px;           /* einheitliche Höhe */
  width: auto;
  object-fit: cover;       /* sauberer Zuschnitt */
  border-radius: 8px;
  flex-shrink: 0;          /* verhindert, dass Bilder gequetscht werden */
}

        a {
            color: #ff7b00;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            text-decoration: underline;
            color: #ffae00;
        }

        .subtext {
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 40px;
        }

        /* ==========================================================================
           3. AVATAR WIDGET (STEUERUNG)
           ========================================================================== */
        .avatar-widget-container {
            width: 120px;
            height: 120px;
            z-index: 10;
        }

        .avatar-bottom-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
        }

        #avatar-animation-holder canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            border: 5px solid #5A6E8F !important; 
            box-shadow: none !important; 
        }
        
        a.avatar-link-wrapper {
            text-decoration: none;
            cursor: pointer;
            display: block;
            width: 100%;
            height: 100%;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
        }

        /* Container für den PDF-Viewer */
        .pdf-viewer-container {
            width: 100%;
            max-width: 900px;
            height: 600px;
            margin: 20px auto;
            border: 1px solid #ccc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

    <script src="p5.min.js"></script>
</head>
<body>

    <div class="avatar-widget-container avatar-bottom-left">
        <a href="index_voll.html" class="avatar-link-wrapper">
            <div id="avatar-animation-holder"></div>
        </a>
    </div>

    <div class="container">
        <h1>Papier&shy;modelle</h1>
      
        <p>Seiteninhalt</p> 
        
        <div class="image-row">
    <figure class="image-item">
        <figcaption>Papervisor Modellübersicht</figcaption>
        <a href="schwarz.html">
            <img src="papervisor_tn.jpg" alt="Papervisor Modell" class="frame">
        </a>
    </figure>

    <figure class="image-item">
        <figcaption>Starcopter Bauplan</figcaption>
        <a href="schwarz.html">
            <img src="starcopter_tn.jpg" alt="Starcopter Modell" class="frame">
        </a>
    </figure>
</div>

        <hr style="border: 0; height: 1px; background: #333; margin: 40px 0;">
        
        <p class="subtext text-center">Sommer 2026</p>
    </div>

    <script>
    const avatarSketch = (p) => {
      let img;
      let blinkTimer = 0;
      let isBlinking = false;

      p.preload = () => {
        img = p.loadImage('me.jpg'); 
      };

      p.setup = () => {
        let canvas = p.createCanvas(350, 350);
        canvas.parent('avatar-animation-holder');
      };

      p.draw = () => {
        p.clear();
        p.image(img, 0, 0, p.width, p.height);

        if (p.frameCount % 200 === 0) {
          isBlinking = true;
          blinkTimer = 10; 
        }

        if (isBlinking) {
          blinkEyes();
          blinkTimer--;
          if (blinkTimer <= 0) {
            isBlinking = false;
          }
        }
           
        p.stroke(0);          
        p.strokeWeight(6);    
        p.fill(183, 189, 189);          
        p.ellipse(175, 185, 170, 120);
      };

      function blinkEyes() {
        p.push(); 
        p.stroke(0);          
        p.strokeWeight(6);    
        p.fill(183, 189, 189);          

        p.ellipse(135, 115, 70, 70); 
        p.ellipse(205, 115, 75, 75); 

        p.strokeWeight(5);
        p.line(130, 115, 174, 115); 
        p.line(176, 115, 220, 115); 

        p.pop(); 
      }
    };

    new p5(avatarSketch);
    </script>

</body>
</html>
