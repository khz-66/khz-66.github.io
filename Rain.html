<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Regentropfen in Pfütze - p5.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            box-shadow: 0 0 30px rgba(0, 100, 200, 0.5);
        }
    </style>
</head>
<body>

<script>
// Regentropfen + Pfütze mit Wellen

let drops = [];
let ripples = [];
let puddleY;

class Drop {
    constructor() {
        this.reset();
    }
    
    reset() {
        this.x = random(width);
        this.y = random(-height, -50);
        this.length = random(12, 22);
        this.speed = random(8, 18);
        this.thickness = random(1, 2.5);
    }
    
    fall() {
        this.y += this.speed;
        
        // Leichter seitlicher Wind-Effekt
        this.x += sin(frameCount * 0.01 + this.y * 0.01) * 0.3;
        
        if (this.y > puddleY) {
            // Tropfen trifft auf Pfütze → Welle erzeugen
            ripples.push(new Ripple(this.x, puddleY));
            this.reset();
        }
    }
    
    show() {
        stroke(180, 220, 255);
        strokeWeight(this.thickness);
        line(this.x, this.y, this.x, this.y + this.length);
    }
}

class Ripple {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.maxRadius = random(35, 65);
        this.alpha = 180;
        this.speed = random(1.2, 2.8);
    }
    
    update() {
        this.radius += this.speed;
        this.alpha -= 2.8;
    }
    
    show() {
        noFill();
        stroke(180, 220, 255, this.alpha);
        strokeWeight(2.5);
        ellipse(this.x, this.y, this.radius * 2, this.radius * 1.1); // leicht oval für Pfützen-Look
    }
    
    isDead() {
        return this.alpha < 0 || this.radius > this.maxRadius;
    }
}

function setup() {
    createCanvas(800, 600);
    puddleY = height * 0.78;
    
    // Anfangstropfen
    for (let i = 0; i < 120; i++) {
        let drop = new Drop();
        drop.y = random(-height * 1.5, height * 0.6); // verteilt starten
        drops.push(drop);
    }
}

function draw() {
    background(15, 25, 45); // dunkler Nachthimmel / Regentag
    
    // Pfütze zeichnen
    fill(40, 70, 120);
    noStroke();
    rect(0, puddleY, width, height - puddleY);
    
    // Reflexion der Pfütze (dunkler)
    fill(30, 55, 100, 160);
    rect(0, puddleY, width, height - puddleY);
    
    // Tropfen aktualisieren und zeichnen
    for (let drop of drops) {
        drop.fall();
        drop.show();
    }
    
    // Wellen aktualisieren und zeichnen
    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.update();
        r.show();
        if (r.isDead()) {
            ripples.splice(i, 1);
        }
    }
    
    // Gelegentlich mehr Tropfen (für Dichte)
    if (random(1) < 0.6) {
        drops.push(new Drop());
    }
    
    // FPS-Anzeige entfernen oder optional
    // fill(255);
    // text(frameRate().toFixed(1), 20, 20);
}

// Maus-Klick erzeugt extra Spritzer
function mousePressed() {
    if (mouseY > puddleY - 50) {
        for (let i = 0; i < 8; i++) {
            ripples.push(new Ripple(mouseX + random(-40, 40), puddleY));
        }
    }
}
</script>

</body>
</html>
