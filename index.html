<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #ff7b00;
            margin: 0 auto;
            margin-bottom: 30px;
            animation: spin 3s ease-in-out infinite;
        }

        .subtext {
            font-size: 1.2rem; /* Gleiche Größe wie der obere Text */
            /* font-weight: bold; /* Macht den Text dicker, damit der Verlauf besser wirkt */
            /* text-transform: uppercase; /* Schreibt alles in Großbuchstaben (wie h1) */
            letter-spacing: 1px; /* Leicht erhöhter Buchstabenabstand */
    
            /* Der exakt gleiche Orange-Verlauf wie bei h1 */
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>


<script src="p5.min.js"></script>
</head>  
<body>

    <div class="container">
        <h1>Coming Soon</h1>
        <p>Hier entsteht gerade etwas Neues. Schau bald wieder vorbei!</p> 
        
        <div class="loader"></div>

        <p class="subtext">Projekt-Start: Sommer 2026</p>

        <a href="https://khz-66.github.io/processing.js/" target="_blank">
        Strahlenblumen
        </a>
  
        
    </div>

 <div class="avatar-widget-container" 
  
  
  
  style="width: 120px; height: 120px; position: fixed; top: 20px; right: 20px; z-index: 999;"
  
  >
    
    
    
    <div id="avatar-animation-holder"></div>
  </div>

  <style>
    /* Verhindert, dass die Canvas ausbricht, macht sie rund und fügt deinen Rahmen hinzu */
    #avatar-animation-holder canvas {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      border: 5px solid #5A6E8F; /* Deine gewählte Rahmenfarbe */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
  </style>

  <script>
    // p5.js im Instanzmodus verpackt, um globale Konflikte zu vermeiden
    const avatarSketch = (p) => {
      let img;
      let blinkTimer = 0;
      let isBlinking = false;

      p.preload = () => {
        // Dein angepasster Bildname
        img = p.loadImage('me.jpg'); 
      };

      p.setup = () => {
        // Interne Auflösung bleibt fix auf deiner 350x350 Basis
        let canvas = p.createCanvas(350, 350);
        canvas.parent('avatar-animation-holder');
      };

      p.draw = () => {
        p.clear(); // Macht den Canvas-Hintergrund transparent, damit das Widget überall sauber aufliegt

        // 1. Das normale Bild zeichnen
        p.image(img, 0, 0, p.width, p.height);

        // 2. Deine angepasste Blinzel-Logik (alle 200 Frames)
        if (p.frameCount % 200 === 0) {
          isBlinking = true;
          blinkTimer = 10; 
        }

        if (isBlinking) {
          blinkEyes();
          blinkTimer--;
          if (blinkTimer <= 0) {
            isBlinking = false;
          }
        }
           
        // Deine überzeichnete Nase (wird immer über das Bild gelegt)
        p.stroke(0);          
        p.strokeWeight(6);    
        p.fill(183, 189, 189);          
        p.ellipse(175, 185, 170, 120);
      };

      // Deine angepasste Funktion für die geschlossenen Augen
      function blinkEyes() {
        p.push(); 
        p.stroke(0);          
        p.strokeWeight(6);    
        p.fill(183, 189, 189);          

        // Deine angepassten Augen-Kreise
        p.ellipse(135, 115, 70, 70); 
        p.ellipse(205, 115, 75, 75); 

        // Deine Lidstriche
        p.strokeWeight(5);
        p.line(130, 115, 174, 115); 
        p.line(176, 115, 220, 115); 

        p.pop(); 
      }
    };

    // Aktiviert den eigenständigen p5-Sketch
    new p5(avatarSketch);
  </script>

</body>
</html>
